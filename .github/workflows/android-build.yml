name: Android Release Build (APK & AAB)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build APK & AAB via Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-24-npm-${{ hashFiles('package-lock.json', 'package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-24-npm-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36 & Build-Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript check & Vite web build
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run build

      - name: Sync Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android
          rm -rf android/app/src/main/assets/public/downloads
          rm -rf android/app/src/main/assets/public/assets/aistudio

      - name: Prepare Android Gradle & Google Services
        shell: bash
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          rm -f android/local.properties

          if [ -n "$GS_JSON" ]; then
            printf '%s\n' "$GS_JSON" > android/app/google-services.json
          elif [ -n "$GS_JSON_B64" ]; then
            if printf '%s' "$GS_JSON_B64" | grep -q '"project_info"'; then
              printf '%s\n' "$GS_JSON_B64" > android/app/google-services.json
            else
              printf '%s' "$GS_JSON_B64" | tr -d '\r\n ' | base64 --decode > android/app/google-services.json
            fi
          fi

          if [ ! -s android/app/google-services.json ]; then
            FALLBACK_GS=$(ls -t public/assets/aistudio/google-services*.json 2>/dev/null | head -n 1 || true)
            if [ -n "$FALLBACK_GS" ] && [ -s "$FALLBACK_GS" ]; then
              cp "$FALLBACK_GS" android/app/google-services.json
              echo "Restored android/app/google-services.json from $FALLBACK_GS."
            fi
          fi

          if [ ! -s android/app/google-services.json ]; then
            echo "::error::Missing android/app/google-services.json. Commit android/app/google-services.json to the repository or set the GOOGLE_SERVICES_JSON_BASE64 (or GOOGLE_SERVICES_JSON) GitHub Actions secret."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const gs = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
            const pkg = gs?.client?.[0]?.client_info?.android_client_info?.package_name;
            const appId = gs?.client?.[0]?.client_info?.mobilesdk_app_id;
            const proj = gs?.project_info?.project_id;
            if (!proj || !appId || pkg !== "com.alhussam.grocery") {
              console.error("Invalid google-services.json:", { proj, appId, pkg });
              process.exit(1);
            }
            console.log("Verified google-services.json:", { proj, appId, pkg });
          '

      - name: Configure Release Signing (without exposing secrets)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEYSTORE_ALIAS" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEYSTORE_ALIAS is missing."
              exit 1
            fi
            KEYSTORE_FILE="${{ runner.temp }}/release.keystore"
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "Configured release signing from GitHub Secrets."
          elif [ -f android/keystore.properties ] && [ -f android/alhussam-release.keystore ]; then
            echo "Configured release signing from android/keystore.properties."
          else
            echo "::error::No release keystore found. Configure ANDROID_KEYSTORE_* secrets or provide android/keystore.properties."
            exit 1
          fi

      - name: Resolve App Version & Version Code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");

            const gradle = fs.readFileSync("android/app/build.gradle", "utf8");
            const nameMatch =
              gradle.match(/resolvedVersionName\s*=.*?"(\d+\.\d+\.\d+)"/) ||
              gradle.match(/versionName\s+"(\d+\.\d+\.\d+)"/);
            const codeMatch =
              gradle.match(/resolvedVersionCode\s*=.*?"(\d+)"/) ||
              gradle.match(/versionCode\s+(\d+)/);

            const baseName = nameMatch ? nameMatch[1] : "1.0.0";
            const baseCode = codeMatch ? parseInt(codeMatch[1], 10) : 1;
            const [baseMajor, baseMinor, basePatch] = baseName
              .split(".")
              .map((n) => parseInt(n, 10));

            const runNumber = parseInt(process.env.GITHUB_RUN_NUMBER || "1", 10);
            const eventName = process.env.GITHUB_EVENT_NAME || "push";
            const prNumber = (process.env.PR_NUMBER || "").trim();

            let releases = [];
            try {
              const out = execFileSync(
                "gh",
                ["release", "list", "--limit", "200", "--json", "tagName,name,isDraft"],
                { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }
              ).trim();
              if (out) releases = JSON.parse(out);
            } catch {
              releases = [];
            }

            let gitTags = [];
            try {
              const rawTags = execFileSync("git", ["tag", "-l", "v*"], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              });
              gitTags = rawTags
                .split(/\r?\n/)
                .map((t) => t.trim())
                .filter(Boolean);
            } catch {
              gitTags = [];
            }

            const existingTagSet = new Set(gitTags);
            let maxReleaseCode = 0;
            let maxReleasePatch = -1;

            for (const rel of releases) {
              if (!rel || rel.isDraft) continue;
              if (rel.tagName) existingTagSet.add(String(rel.tagName).trim());

              const tagVer = String(rel.tagName || "").match(/^v(\d+)\.(\d+)\.(\d+)/);
              const nameVer = String(rel.name || "").match(/v(\d+)\.(\d+)\.(\d+)/);
              const verMatch = tagVer || nameVer;
              if (verMatch) {
                const maj = parseInt(verMatch[1], 10);
                const min = parseInt(verMatch[2], 10);
                const pat = parseInt(verMatch[3], 10);
                if (maj === baseMajor && min === baseMinor && pat > maxReleasePatch) {
                  maxReleasePatch = pat;
                }
              }

              const codeInName = String(rel.name || "").match(/(?:Code|code|build)\s*[:#-]?\s*(\d+)/);
              const codeInTag = String(rel.tagName || "").match(/code(\d+)/i);
              const parsedCode = codeInName
                ? parseInt(codeInName[1], 10)
                : codeInTag
                ? parseInt(codeInTag[1], 10)
                : 0;
              if (parsedCode > maxReleaseCode) {
                maxReleaseCode = parsedCode;
              }
            }

            for (const tag of gitTags) {
              const m = tag.match(/^v(\d+)\.(\d+)\.(\d+)/);
              if (m) {
                const maj = parseInt(m[1], 10);
                const min = parseInt(m[2], 10);
                const pat = parseInt(m[3], 10);
                if (maj === baseMajor && min === baseMinor && pat > maxReleasePatch) {
                  maxReleasePatch = pat;
                }
              }
            }

            let nextPatch = Math.max(basePatch, maxReleasePatch) + 1;
            let versionName = `${baseMajor}.${baseMinor}.${nextPatch}`;
            while (existingTagSet.has(`v${versionName}`)) {
              nextPatch += 1;
              versionName = `${baseMajor}.${baseMinor}.${nextPatch}`;
            }

            if (eventName === "pull_request" && prNumber) {
              versionName = `${versionName}-pr.${prNumber}`;
            }

            const versionCode = Math.max(
              baseCode + 1,
              maxReleaseCode + 1,
              runNumber + 1
            );

            const releaseTag = `v${versionName}`;
            const apkFilename = `alhussam-grocery-v${versionName}-code${versionCode}.apk`;
            const aabFilename = `alhussam-grocery-v${versionName}-code${versionCode}.aab`;

            const envOut = [
              `ANDROID_VERSION_NAME=${versionName}`,
              `ANDROID_VERSION_CODE=${versionCode}`,
              `RELEASE_TAG=${releaseTag}`,
              `APK_FILENAME=${apkFilename}`,
              `AAB_FILENAME=${aabFilename}`,
            ].join("\n") + "\n";

            fs.appendFileSync(process.env.GITHUB_ENV, envOut);
            console.log("Resolved Android release version:", {
              versionName,
              versionCode,
              releaseTag,
              apkFilename,
              aabFilename,
            });
          '

      - name: Build APK & AAB via Gradle
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease \
            -PandroidVersionCode="$ANDROID_VERSION_CODE" \
            -PandroidVersionName="$ANDROID_VERSION_NAME" \
            --no-daemon --max-workers=1 --stacktrace 2>&1 | tee "${{ runner.temp }}/gradle-build.log"

      - name: Diagnose Gradle failure on error
        if: failure()
        shell: bash
        run: |
          if [ -f "${{ runner.temp }}/gradle-build.log" ]; then
            echo "=== Last 120 lines of Gradle build log ==="
            tail -n 120 "${{ runner.temp }}/gradle-build.log"
          fi

      - name: Verify APK, AAB, Version & Release Signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          APK_FILE=$(find android/app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          AAB_FILE=$(find android/app/build/outputs/bundle/release -maxdepth 2 -type f -name "*.aab" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK was not generated or is empty."
            exit 1
          fi

          if [ -z "$AAB_FILE" ] || [ ! -s "$AAB_FILE" ]; then
            echo "::error::Release AAB was not generated or is empty."
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR/build-tools" ]; then
            echo "::error::Android SDK build-tools directory not found (ANDROID_HOME/ANDROID_SDK_ROOT)."
            exit 1
          fi

          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $SDK_DIR/build-tools."
            exit 1
          fi

          SIGN_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_FILE")
          printf '%s\n' "$SIGN_OUTPUT"
          if printf '%s' "$SIGN_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "::error::APK was signed with a debug certificate instead of the release keystore."
            exit 1
          fi

          AAPT2=$(find "$SDK_DIR/build-tools" -name aapt2 | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK_FILE" | head -n 5)
            printf '%s\n' "$BADGING"
            if ! printf '%s' "$BADGING" | grep -q "name='com.alhussam.grocery'"; then
              echo "::error::APK package name mismatch."
              exit 1
            fi
            if ! printf '%s' "$BADGING" | grep -q "versionCode='${ANDROID_VERSION_CODE}'"; then
              echo "::error::APK versionCode does not match ${ANDROID_VERSION_CODE}."
              exit 1
            fi
            if ! printf '%s' "$BADGING" | grep -q "versionName='${ANDROID_VERSION_NAME}'"; then
              echo "::error::APK versionName does not match ${ANDROID_VERSION_NAME}."
              exit 1
            fi
          fi

          jarsigner -verify "$AAB_FILE"

          cp "$APK_FILE" "release-artifacts/${APK_FILENAME}"
          cp "$AAB_FILE" "release-artifacts/${AAB_FILENAME}"
          ls -lh release-artifacts/

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alhussam-grocery-v${{ env.ANDROID_VERSION_NAME }}-code${{ env.ANDROID_VERSION_CODE }}-apk
          path: release-artifacts/${{ env.APK_FILENAME }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alhussam-grocery-v${{ env.ANDROID_VERSION_NAME }}-code${{ env.ANDROID_VERSION_CODE }}-aab
          path: release-artifacts/${{ env.AAB_FILENAME }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with Separate APK & AAB
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const vName = process.env.ANDROID_VERSION_NAME;
            const vCode = process.env.ANDROID_VERSION_CODE;
            const apk = process.env.APK_FILENAME;
            const aab = process.env.AAB_FILENAME;
            const notes = [
              `## بقالة الحسام - الإصدار v${vName} (Code ${vCode})`,
              "",
              `- **رقم الإصدار (Version Name):** \`${vName}\``,
              `- **رمز الإصدار (Version Code):** \`${vCode}\``,
              `- **معرف الحزمة (Package ID):** \`com.alhussam.grocery\``,
              "",
              "### الملفات المرفقة",
              `1. **\`${apk}\`**: ملف APK مستقل وموقّع بمفتاح الإصدار الرسمي؛ عند تحميله على هاتف أندرويد يُفتح ويُثبَّت مباشرة كتحديث فوق النسخة المثبتة دون حذفها أو فقدان البيانات.`,
              `2. **\`${aab}\`**: ملف AAB مستقل للنشر على Google Play.`,
            ].join("\n");
            fs.writeFileSync(process.argv[1], notes, "utf8");
          ' "${{ runner.temp }}/release-notes.md"

          gh release create "$RELEASE_TAG" \
            "release-artifacts/${APK_FILENAME}" \
            "release-artifacts/${AAB_FILENAME}" \
            --target "$GITHUB_SHA" \
            --title "بقالة الحسام v${ANDROID_VERSION_NAME} (Code ${ANDROID_VERSION_CODE})" \
            --notes-file "${{ runner.temp }}/release-notes.md"
